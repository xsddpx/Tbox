name: 临时导出 Windows 签名证书

# 一次性使用：把仓库 Secret 中的 Windows PFX 与密码导出为 artifact，供本机下载。
# 下载后应立即删除本 workflow、对应 run 和 artifact。

on:
  push:
    branches: [dsh/export-windows-cert]
    paths: [.github/workflows/export-windows-cert.yml]
  workflow_dispatch:

jobs:
  export:
    runs-on: windows-latest
    steps:
      - name: 解码 PFX 并写入密码
        shell: pwsh
        env:
          TBOX_WINDOWS_PFX_BASE64: ${{ secrets.TBOX_WINDOWS_PFX_BASE64 }}
          TBOX_WINDOWS_PFX_PASSWORD: ${{ secrets.TBOX_WINDOWS_PFX_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Path export -Force | Out-Null
          [IO.File]::WriteAllBytes("$PWD/export/Tbox-Development.pfx", [Convert]::FromBase64String($env:TBOX_WINDOWS_PFX_BASE64))
          # 用无 BOM 的 UTF-8 写入，避免密码前后混入不可见字符。
          [IO.File]::WriteAllText("$PWD/export/pfx-password.txt", $env:TBOX_WINDOWS_PFX_PASSWORD, (New-Object System.Text.UTF8Encoding($false)))
          # 顺带导出公钥证书，便于本机信任。
          $password = ConvertTo-SecureString $env:TBOX_WINDOWS_PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath "$PWD/export/Tbox-Development.pfx" -Password $password -CertStoreLocation Cert:\CurrentUser\My -Exportable
          Export-Certificate -Cert $cert -FilePath "$PWD/export/Tbox-Development.cer" | Out-Null
          Write-Host "Subject: $($cert.Subject)"
          Write-Host "Thumbprint: $($cert.Thumbprint)"
          Write-Host "NotAfter: $($cert.NotAfter)"
          Get-ChildItem export | Select-Object Name, Length

      - name: 上传导出结果
        uses: actions/upload-artifact@v4
        with:
          name: windows-signing-cert
          path: export/
          retention-days: 1
