name: Shared desktop checks

on:
  push:
    branches: [main, 'codex/**']
    paths: ['src/**', 'tests/**', 'scripts/**', 'assets/media-test/**', 'global.json', '.github/workflows/**']
  pull_request:
    paths: ['src/**', 'tests/**', 'scripts/**', 'assets/media-test/**', 'global.json', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.313
            8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test release transaction safeguards
        run: python -m unittest discover -s tests/release -v
      - name: Test shared core
        run: dotnet test tests/Tbox.Core.Tests/Tbox.Core.Tests.csproj -c Release
      - name: Test shared desktop
        run: dotnet test tests/Tbox.Desktop.Tests/Tbox.Desktop.Tests.csproj -c Release
      - name: Test Windows playback and exports
        if: runner.os == 'Windows'
        run: dotnet run --project tests/Tbox.MediaSmoke/Tbox.MediaSmoke.csproj -c Release -- assets/media-test/fixture.mp4 TEMP/media-smoke src/Tbox.App/ThirdParty/FFmpeg/bin/ffmpeg.exe
      - name: Test Windows package safeguards
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/windows/test-package-policy.ps1
      - name: Validate shared Windows MSIX payload
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/package-desktop-windows.ps1 -VerifyOnly
      - name: Preserve Windows package verification reports
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-verification
          path: |
            TEMP/windows-package/**/verification.json
            TEMP/windows-package/**/media/result.json
          if-no-files-found: ignore
      - name: Prepare macOS media dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          command -v pkg-config || brew install pkgconf
          bash scripts/prepare-macos-media.sh
      - name: Test macOS playback and exports
        if: runner.os == 'macOS'
        run: dotnet run --project tests/Tbox.MediaSmoke/Tbox.MediaSmoke.csproj -c Release -- assets/media-test/fixture.mp4 TEMP/media-smoke TEMP/media-runtime/FFmpeg/bin/ffmpeg TEMP/media-runtime/VLC
      - name: Compile macOS system bridge
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p TEMP
          swiftc -swift-version 5 -O -emit-library -target "$(uname -m)-apple-macosx14.0" src/Tbox.Desktop/Platform/macos/*.swift -o TEMP/libTboxNative.dylib
      - name: Test macOS signing safeguards
        if: runner.os == 'macOS'
        run: bash tests/macos/test-signing-policy.sh

  signing-readiness:
    # Explicit, temporary opt-in for configuring persistent identities. No Tbox
    # package or public Release is produced, and PRs never receive these secrets.
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/feat-macos-basic' && vars.TBOX_VERIFY_SIGNING == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Windows signing identity on an isolated fixture
        if: runner.os == 'Windows'
        shell: powershell
        env:
          TBOX_WINDOWS_PFX_BASE64: ${{ secrets.TBOX_WINDOWS_PFX_BASE64 }}
          TBOX_WINDOWS_PFX_PASSWORD: ${{ secrets.TBOX_WINDOWS_PFX_PASSWORD }}
          TBOX_WINDOWS_CERT_SHA1: ${{ vars.TBOX_WINDOWS_CERT_SHA1 }}
        run: ./scripts/release/sign-and-package-windows.ps1 -VerifyIdentityOnly
      - name: Validate Mac signing identity on an isolated fixture
        if: runner.os == 'macOS'
        env:
          TBOX_MAC_P12_BASE64: ${{ secrets.TBOX_MAC_P12_BASE64 }}
          TBOX_MAC_P12_PASSWORD: ${{ secrets.TBOX_MAC_P12_PASSWORD }}
          TBOX_MAC_CERT_SHA1: ${{ vars.TBOX_MAC_CERT_SHA1 }}
          TBOX_MAC_SIGN_IDENTITY: ${{ vars.TBOX_MAC_SIGN_IDENTITY }}
        run: bash scripts/release/sign-and-package-macos.sh --verify-identity-only

  windows-installed-package:
    # Opt-in acceptance of the actual installer on a disposable Windows runner.
    # Artifacts remain private; this job never creates a public Release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/feat-macos-basic' && vars.TBOX_VERIFY_INSTALLER == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.313
            8.0.x
      - name: Build, sign, install and launch the actual Windows MSIX
        shell: powershell
        env:
          TBOX_WINDOWS_PFX_BASE64: ${{ secrets.TBOX_WINDOWS_PFX_BASE64 }}
          TBOX_WINDOWS_PFX_PASSWORD: ${{ secrets.TBOX_WINDOWS_PFX_PASSWORD }}
          TBOX_WINDOWS_CERT_SHA1: ${{ vars.TBOX_WINDOWS_CERT_SHA1 }}
        run: ./scripts/release/sign-and-package-windows.ps1
      - name: Preserve verified installer and package history
        uses: actions/upload-artifact@v4
        with:
          name: windows-installed-package
          path: |
            artifacts/Tbox_*_win-x64.msix
            artifacts/Tbox-Development.cer
            docs/release-history.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve installed application verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installed-verification
          path: |
            TEMP/windows-package/**/installed-smoke/**
            TEMP/windows-package/**/media/result.json
          if-no-files-found: ignore
          retention-days: 14
