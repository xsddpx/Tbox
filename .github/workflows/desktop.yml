name: Shared desktop checks

on:
  push:
    branches: [main, 'codex/**']
    paths: ['src/**', 'tests/**', 'global.json', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'global.json', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.313
            8.0.x
      - name: Test shared core
        run: dotnet test tests/Tbox.Core.Tests/Tbox.Core.Tests.csproj -c Release
      - name: Test shared desktop
        run: dotnet test tests/Tbox.Desktop.Tests/Tbox.Desktop.Tests.csproj -c Release
      - name: Compile macOS system bridge
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p TEMP
          swiftc -swift-version 5 -O -emit-library -target "$(uname -m)-apple-macosx14.0" src/Tbox.Desktop/Platform/macos/TboxNative.swift -o TEMP/libTboxNative.dylib
