name: Shared desktop checks

on:
  push:
    branches: [main, 'codex/**']
    paths: ['src/**', 'tests/**', 'scripts/**', 'deploy/cloud/**', 'assets/media-test/**', 'global.json', '.github/workflows/**']
  pull_request:
    paths: ['src/**', 'tests/**', 'scripts/**', 'deploy/cloud/**', 'assets/media-test/**', 'global.json', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      verify_installer:
        description: 'Build, sign, install, verify and retain the Windows MSIX'
        required: true
        default: false
        type: boolean
      verify_macos_installer:
        description: 'Build, sign, verify and retain the Mac ZIP'
        required: true
        default: false
        type: boolean
      verify_remote_service:
        description: 'Verify Windows MSIX service registration and upgrade with an isolated fixture'
        default: false
        type: boolean
      verify_remote_engine:
        description: 'Build native RustDesk authorization tests on Windows and macOS'
        default: false
        type: boolean
      build_remote_viewer:
        description: 'Build the patched RustDesk macOS viewer for package integration'
        default: false
        type: boolean

permissions:
  contents: read

env:
  TBOX_ACCOUNT_ORIGIN: ${{ vars.TBOX_ACCOUNT_ORIGIN }}

jobs:
  remote-authorization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Tbox remote authorization
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/TEMP/remote-target
        run: |
          rustup update stable --no-self-update
          cargo +stable test --locked --manifest-path src/Tbox.Remote/Cargo.toml
      - name: Apply the authorization patch to the pinned RustDesk sources
        run: bash scripts/prepare-remote-engine.sh

  remote-engine-macos:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_remote_engine
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          path: TEMP/vcpkg
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: TEMP/vcpkg/installed
          key: rustdesk-arm64-osx-9e593bb1-aom-jpeg-vpx-yuv-opus
      - name: Prepare and type-check the patched client
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          CARGO_TARGET_DIR: ${{ github.workspace }}/TEMP/rustdesk-target
          VCPKG_ROOT: ${{ github.workspace }}/TEMP/vcpkg
        run: |
          rustup update stable --no-self-update
          engine="$(bash scripts/prepare-remote-engine.sh)"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          cd "$engine"
          "$VCPKG_ROOT/vcpkg" install aom libjpeg-turbo libvpx libyuv opus \
            --triplet arm64-osx --classic
          cargo +stable test --lib tbox_remote::tests

  remote-engine-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_remote_engine
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          path: TEMP/vcpkg
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: TEMP/vcpkg/installed
          key: rustdesk-x64-windows-static-9e593bb1-aom-jpeg-vpx-yuv-opus
      - name: Prepare the patched client sources
        shell: bash
        run: echo "TBOX_REMOTE_SOURCE=$(cygpath -wa "$(bash scripts/prepare-remote-engine.sh)")" >> "$GITHUB_ENV"
      - name: Build and test the patched client
        shell: pwsh
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          CARGO_TARGET_DIR: ${{ github.workspace }}/TEMP/rustdesk-target
          VCPKG_ROOT: ${{ github.workspace }}/TEMP/vcpkg
        run: |
          rustup update stable --no-self-update
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location $env:TBOX_REMOTE_SOURCE
          & "$env:VCPKG_ROOT\vcpkg.exe" install aom libjpeg-turbo libvpx libyuv opus --triplet x64-windows-static --classic
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable test --lib tbox_remote::tests

  remote-viewer-bridge:
    if: github.event_name == 'workflow_dispatch' && inputs.build_remote_viewer
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: 95cca3f661f635b3cc85c04935fe8d96d8f432ef
          submodules: recursive
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Generate the pinned upstream Flutter bindings
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang libclang-dev libgtk-3-dev llvm-dev nasm
          rustup toolchain install 1.75.0 --profile minimal --component rustfmt
          export RUSTUP_TOOLCHAIN=1.75.0
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          bash .github/patches/apply_flutter_3.44_source_patches.sh
          (cd flutter && flutter pub get)
          flutter_rust_bridge_codegen --rust-input src/flutter_ffi.rs \
            --dart-output flutter/lib/generated_bridge.dart \
            --c-output flutter/macos/Runner/bridge_generated.h
      - uses: actions/upload-artifact@v4
        with:
          name: tbox-remote-flutter-bridge
          path: |
            src/bridge_generated.rs
            src/bridge_generated.io.rs
            flutter/lib/generated_bridge.dart
            flutter/lib/generated_bridge.freezed.dart
            flutter/macos/Runner/bridge_generated.h
          if-no-files-found: error
          retention-days: 7

  remote-viewer-macos:
    if: github.event_name == 'workflow_dispatch' && inputs.build_remote_viewer
    needs: remote-viewer-bridge
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          path: TEMP/vcpkg
          persist-credentials: false
      - name: Prepare the patched client
        run: echo "TBOX_REMOTE_SOURCE=$(bash scripts/prepare-remote-engine.sh)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: tbox-remote-flutter-bridge
          path: ${{ env.TBOX_REMOTE_SOURCE }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: TEMP/vcpkg/installed
          key: rustdesk-arm64-osx-9e593bb1-aom-jpeg-vpx-yuv-opus
      - name: Build the macOS viewer
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          VCPKG_ROOT: ${{ github.workspace }}/TEMP/vcpkg
        run: |
          brew install gnu-sed
          export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
          flutter config --no-enable-swift-package-manager
          rustup update stable --no-self-update
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          cd "$TBOX_REMOTE_SOURCE"
          "$VCPKG_ROOT/vcpkg" install aom libjpeg-turbo libvpx libyuv opus --triplet arm64-osx --classic
          bash .github/patches/apply_flutter_3.44_source_patches.sh
          rustup override set stable
          cargo check --lib --features flutter
          python3 build.py --flutter
          viewer=flutter/build/macos/Build/Products/Release/RustDesk.app
          test -x "$viewer/Contents/MacOS/RustDesk"
          ditto -c -k --keepParent "$viewer" "$RUNNER_TEMP/tbox-remote-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: tbox-remote-macos-viewer
          path: ${{ runner.temp }}/tbox-remote-macos.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  cloud:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Validate private account and synchronization
        env:
          TBOX_TEST_POSTGRES: Host=127.0.0.1;Port=${{ job.services.postgres.ports[5432] }};Database=postgres;Username=postgres
        run: dotnet test tests/Tbox.Cloud.Tests/Tbox.Cloud.Tests.csproj -c Release

  windows-media:
    uses: ./.github/workflows/windows-media.yml

  test:
    needs: windows-media
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: windows-media-runtime
          path: TEMP/media-runtime/windows
      - name: Build cold and test Windows file dialogs
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: ./scripts/test-windows-folders.ps1
      - name: Preserve Windows folder integration result
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-folder-verification
          path: |
            TEMP/folder-smoke/result.json
            TEMP/folder-smoke/tbox.log
            TEMP/folder-smoke/windows.json
          if-no-files-found: ignore
      - name: Test release transaction safeguards
        run: python -m unittest discover -s tests/release -v
      - name: Test shared core
        run: dotnet test tests/Tbox.Core.Tests/Tbox.Core.Tests.csproj -c Release
      - name: Test shared desktop
        env:
          TBOX_UI_PREVIEWS: ${{ github.workspace }}/TEMP/account-preview
        timeout-minutes: 5
        run: >-
          dotnet test tests/Tbox.Desktop.Tests/Tbox.Desktop.Tests.csproj -c Release
          --logger "console;verbosity=normal"
          --blame-hang --blame-hang-timeout 90s --blame-hang-dump-type none
      - name: Preserve rendered account page
        uses: actions/upload-artifact@v4
        with:
          name: account-preview-${{ runner.os }}
          path: TEMP/account-preview/main-Account-800.png
          if-no-files-found: error
      - name: Test Windows playback and exports
        if: runner.os == 'Windows'
        run: dotnet run --project tests/Tbox.MediaSmoke/Tbox.MediaSmoke.csproj -c Release -- assets/media-test/fixture.mp4 TEMP/media-smoke TEMP/media-runtime/windows/bin/ffmpeg.exe
      - name: Test Windows package safeguards
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/windows/test-package-policy.ps1
      - name: Validate shared Windows MSIX payload
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/package-desktop-windows.ps1 -VerifyOnly
      - name: Preserve Windows package verification reports
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-verification
          path: |
            TEMP/windows-package/**/verification.json
            TEMP/windows-package/**/media/result.json
          if-no-files-found: ignore
      - name: Prepare macOS media dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          command -v pkg-config || brew install pkgconf
          bash scripts/prepare-macos-media.sh
      - name: Test macOS playback and exports
        if: runner.os == 'macOS'
        run: dotnet run --project tests/Tbox.MediaSmoke/Tbox.MediaSmoke.csproj -c Release -- assets/media-test/fixture.mp4 TEMP/media-smoke TEMP/media-runtime/FFmpeg/bin/ffmpeg TEMP/media-runtime/VLC
      - name: Test macOS folder panel ownership and compile system bridge
        if: runner.os == 'macOS'
        shell: bash
        run: bash tests/macos/test-folder-panel-policy.sh
      - name: Test macOS local install destination
        if: runner.os == 'macOS'
        run: bash tests/macos/test-install-destination.sh
      - name: Test macOS signing safeguards
        if: runner.os == 'macOS'
        run: bash tests/macos/test-signing-policy.sh
      - name: Test macOS global shortcut conflicts across processes
        if: runner.os == 'macOS'
        timeout-minutes: 2
        run: bash tests/macos/test-hotkey-registration.sh

  signing-readiness:
    # Explicit, temporary opt-in for configuring persistent identities. No Tbox
    # package or public Release is produced, and PRs never receive these secrets.
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/feat-macos-basic' && vars.TBOX_VERIFY_SIGNING == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-26]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Windows signing identity on an isolated fixture
        if: runner.os == 'Windows'
        shell: powershell
        env:
          TBOX_WINDOWS_PFX_BASE64: ${{ secrets.TBOX_WINDOWS_PFX_BASE64 }}
          TBOX_WINDOWS_PFX_PASSWORD: ${{ secrets.TBOX_WINDOWS_PFX_PASSWORD }}
          TBOX_WINDOWS_CERT_SHA1: ${{ vars.TBOX_WINDOWS_CERT_SHA1 }}
        run: ./scripts/release/sign-and-package-windows.ps1 -VerifyIdentityOnly
      - name: Validate Mac signing identity on an isolated fixture
        if: runner.os == 'macOS'
        env:
          TBOX_MAC_P12_BASE64: ${{ secrets.TBOX_MAC_P12_BASE64 }}
          TBOX_MAC_P12_PASSWORD: ${{ secrets.TBOX_MAC_P12_PASSWORD }}
          TBOX_MAC_CERT_SHA1: ${{ vars.TBOX_MAC_CERT_SHA1 }}
          TBOX_MAC_SIGN_IDENTITY: ${{ vars.TBOX_MAC_SIGN_IDENTITY }}
        run: bash scripts/release/sign-and-package-macos.sh --verify-identity-only

  windows-installed-package:
    needs: windows-media
    # Opt-in acceptance of the actual installer on a disposable Windows runner.
    # Artifacts are accessible from this public repository; never include secrets.
    # This job does not create a Release.
    if: github.event_name == 'workflow_dispatch' && inputs.verify_installer
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: windows-media-runtime
          path: TEMP/media-runtime/windows
      - name: Build, sign, install and launch the actual Windows MSIX
        shell: powershell
        env:
          TBOX_WINDOWS_PFX_BASE64: ${{ secrets.TBOX_WINDOWS_PFX_BASE64 }}
          TBOX_WINDOWS_PFX_PASSWORD: ${{ secrets.TBOX_WINDOWS_PFX_PASSWORD }}
          TBOX_WINDOWS_CERT_SHA1: ${{ vars.TBOX_WINDOWS_CERT_SHA1 }}
        run: ./scripts/release/sign-and-package-windows.ps1 -VerifyCapture -VerifyRecording
      - name: Preserve verified installer and package history
        uses: actions/upload-artifact@v4
        with:
          name: windows-installed-package
          path: |
            artifacts/Tbox_*_win-x64.msix
            artifacts/Tbox-Development.cer
            docs/release-history.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve installed application verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installed-verification
          path: |
            TEMP/windows-package/**/installed-smoke/**
            TEMP/windows-package/**/media/result.json
          if-no-files-found: ignore
          retention-days: 14

  windows-remote-service:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_remote_service
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the isolated signed Windows service package and upgrade
        shell: powershell
        env:
          TBOX_WINDOWS_PFX_BASE64: ${{ secrets.TBOX_WINDOWS_PFX_BASE64 }}
          TBOX_WINDOWS_PFX_PASSWORD: ${{ secrets.TBOX_WINDOWS_PFX_PASSWORD }}
          TBOX_WINDOWS_CERT_SHA1: ${{ vars.TBOX_WINDOWS_CERT_SHA1 }}
        run: ./scripts/release/sign-and-package-windows.ps1 -VerifyRemoteService
      - name: Preserve service verification results
        uses: actions/upload-artifact@v4
        with:
          name: windows-remote-service-fixture
          path: TEMP/remote-service-fixture/result.json
          if-no-files-found: error

  macos-signed-package:
    # Build a development package with the existing release identity without creating a Release.
    if: github.event_name == 'workflow_dispatch' && inputs.verify_macos_installer
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Check Apple Silicon runner and media tools
        run: |
          test "$(uname -m)" = arm64
          command -v pkg-config || brew install pkgconf
      - name: Sign, package and verify Mac
        env:
          TBOX_MAC_P12_BASE64: ${{ secrets.TBOX_MAC_P12_BASE64 }}
          TBOX_MAC_P12_PASSWORD: ${{ secrets.TBOX_MAC_P12_PASSWORD }}
          TBOX_MAC_CERT_SHA1: ${{ vars.TBOX_MAC_CERT_SHA1 }}
          TBOX_MAC_SIGN_IDENTITY: ${{ vars.TBOX_MAC_SIGN_IDENTITY }}
        run: bash scripts/release/sign-and-package-macos.sh
      - name: Preserve verified installer and package history
        uses: actions/upload-artifact@v4
        with:
          name: macos-signed-package
          path: |
            artifacts/Tbox_*_osx-arm64.zip
            docs/release-history.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
