name: Shared desktop checks

on:
  push:
    branches: [main, 'codex/**']
    paths: ['src/**', 'tests/**', 'scripts/**', 'assets/media-test/**', 'global.json', '.github/workflows/**']
  pull_request:
    paths: ['src/**', 'tests/**', 'scripts/**', 'assets/media-test/**', 'global.json', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      verify_installer:
        description: 'Build, sign, install, verify and retain the Windows MSIX'
        required: true
        default: false
        type: boolean
      verify_macos_installer:
        description: 'Build, sign, verify and retain the Mac ZIP'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  windows-media:
    uses: ./.github/workflows/windows-media.yml

  test:
    needs: windows-media
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: windows-media-runtime
          path: TEMP/media-runtime/windows
      - name: Build cold and test Windows file dialogs
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: ./scripts/test-windows-folders.ps1
      - name: Preserve Windows folder integration result
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-folder-verification
          path: |
            TEMP/folder-smoke/result.json
            TEMP/folder-smoke/tbox.log
            TEMP/folder-smoke/windows.json
          if-no-files-found: ignore
      - name: Test release transaction safeguards
        run: python -m unittest discover -s tests/release -v
      - name: Test shared core
        run: dotnet test tests/Tbox.Core.Tests/Tbox.Core.Tests.csproj -c Release
      - name: Test shared desktop
        timeout-minutes: 5
        run: >-
          dotnet test tests/Tbox.Desktop.Tests/Tbox.Desktop.Tests.csproj -c Release
          --logger "console;verbosity=normal"
          --blame-hang --blame-hang-timeout 90s --blame-hang-dump-type none
      - name: Test Windows playback and exports
        if: runner.os == 'Windows'
        run: dotnet run --project tests/Tbox.MediaSmoke/Tbox.MediaSmoke.csproj -c Release -- assets/media-test/fixture.mp4 TEMP/media-smoke TEMP/media-runtime/windows/bin/ffmpeg.exe
      - name: Test Windows package safeguards
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/windows/test-package-policy.ps1
      - name: Validate shared Windows MSIX payload
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/package-desktop-windows.ps1 -VerifyOnly
      - name: Preserve Windows package verification reports
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-verification
          path: |
            TEMP/windows-package/**/verification.json
            TEMP/windows-package/**/media/result.json
          if-no-files-found: ignore
      - name: Prepare macOS media dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          command -v pkg-config || brew install pkgconf
          bash scripts/prepare-macos-media.sh
      - name: Test macOS playback and exports
        if: runner.os == 'macOS'
        run: dotnet run --project tests/Tbox.MediaSmoke/Tbox.MediaSmoke.csproj -c Release -- assets/media-test/fixture.mp4 TEMP/media-smoke TEMP/media-runtime/FFmpeg/bin/ffmpeg TEMP/media-runtime/VLC
      - name: Test macOS folder panel ownership and compile system bridge
        if: runner.os == 'macOS'
        shell: bash
        run: bash tests/macos/test-folder-panel-policy.sh
      - name: Test macOS local install destination
        if: runner.os == 'macOS'
        run: bash tests/macos/test-install-destination.sh
      - name: Test macOS signing safeguards
        if: runner.os == 'macOS'
        run: bash tests/macos/test-signing-policy.sh
      - name: Test macOS global shortcut conflicts across processes
        if: runner.os == 'macOS'
        timeout-minutes: 2
        run: bash tests/macos/test-hotkey-registration.sh

  signing-readiness:
    # Explicit, temporary opt-in for configuring persistent identities. No Tbox
    # package or public Release is produced, and PRs never receive these secrets.
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/feat-macos-basic' && vars.TBOX_VERIFY_SIGNING == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-26]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Windows signing identity on an isolated fixture
        if: runner.os == 'Windows'
        shell: powershell
        env:
          TBOX_WINDOWS_PFX_BASE64: ${{ secrets.TBOX_WINDOWS_PFX_BASE64 }}
          TBOX_WINDOWS_PFX_PASSWORD: ${{ secrets.TBOX_WINDOWS_PFX_PASSWORD }}
          TBOX_WINDOWS_CERT_SHA1: ${{ vars.TBOX_WINDOWS_CERT_SHA1 }}
        run: ./scripts/release/sign-and-package-windows.ps1 -VerifyIdentityOnly
      - name: Validate Mac signing identity on an isolated fixture
        if: runner.os == 'macOS'
        env:
          TBOX_MAC_P12_BASE64: ${{ secrets.TBOX_MAC_P12_BASE64 }}
          TBOX_MAC_P12_PASSWORD: ${{ secrets.TBOX_MAC_P12_PASSWORD }}
          TBOX_MAC_CERT_SHA1: ${{ vars.TBOX_MAC_CERT_SHA1 }}
          TBOX_MAC_SIGN_IDENTITY: ${{ vars.TBOX_MAC_SIGN_IDENTITY }}
        run: bash scripts/release/sign-and-package-macos.sh --verify-identity-only

  windows-installed-package:
    needs: windows-media
    # Opt-in acceptance of the actual installer on a disposable Windows runner.
    # Artifacts are accessible from this public repository; never include secrets.
    # This job does not create a Release.
    if: github.event_name == 'workflow_dispatch' && inputs.verify_installer
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: windows-media-runtime
          path: TEMP/media-runtime/windows
      - name: Build, sign, install and launch the actual Windows MSIX
        shell: powershell
        env:
          TBOX_WINDOWS_PFX_BASE64: ${{ secrets.TBOX_WINDOWS_PFX_BASE64 }}
          TBOX_WINDOWS_PFX_PASSWORD: ${{ secrets.TBOX_WINDOWS_PFX_PASSWORD }}
          TBOX_WINDOWS_CERT_SHA1: ${{ vars.TBOX_WINDOWS_CERT_SHA1 }}
        run: ./scripts/release/sign-and-package-windows.ps1 -VerifyCapture -VerifyRecording
      - name: Preserve verified installer and package history
        uses: actions/upload-artifact@v4
        with:
          name: windows-installed-package
          path: |
            artifacts/Tbox_*_win-x64.msix
            artifacts/Tbox-Development.cer
            docs/release-history.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve installed application verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installed-verification
          path: |
            TEMP/windows-package/**/installed-smoke/**
            TEMP/windows-package/**/media/result.json
          if-no-files-found: ignore
          retention-days: 14

  macos-signed-package:
    # Build a development package with the existing release identity without creating a Release.
    if: github.event_name == 'workflow_dispatch' && inputs.verify_macos_installer
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Check Apple Silicon runner and media tools
        run: |
          test "$(uname -m)" = arm64
          command -v pkg-config || brew install pkgconf
      - name: Sign, package and verify Mac
        env:
          TBOX_MAC_P12_BASE64: ${{ secrets.TBOX_MAC_P12_BASE64 }}
          TBOX_MAC_P12_PASSWORD: ${{ secrets.TBOX_MAC_P12_PASSWORD }}
          TBOX_MAC_CERT_SHA1: ${{ vars.TBOX_MAC_CERT_SHA1 }}
          TBOX_MAC_SIGN_IDENTITY: ${{ vars.TBOX_MAC_SIGN_IDENTITY }}
        run: bash scripts/release/sign-and-package-macos.sh
      - name: Verify macOS 26 rejects the app bundle
        run: |
          app=TEMP/build/osx-arm64/Tbox.app
          if result="$(/usr/bin/open -n "$app" 2>&1)"; then
            echo "macOS 26 opened a bundle that requires macOS 27."
            exit 1
          fi
          printf '%s\n' "$result"
          [[ "$result" == *-10825* ]]
      - name: Preserve verified installer and package history
        uses: actions/upload-artifact@v4
        with:
          name: macos-signed-package
          path: |
            artifacts/Tbox_*_osx-arm64.zip
            docs/release-history.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
