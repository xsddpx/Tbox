<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="96 96 832 832" role="img" aria-labelledby="title desc">
  <title id="title">Tbox</title>
  <desc id="desc">A violet isometric box with a white T on its left face, on a dark rounded square.</desc>
  <defs>
    <path id="tile" d="M352 96H672C850 96 928 128 928 352V672C928 850 896 928 672 928H352C174 928 96 896 96 672V352C96 174 128 96 352 96Z"/>
    <linearGradient id="graphite" x1="0" y1="0" x2=".2" y2="1">
      <stop stop-color="#2A2930"/>
      <stop offset="1" stop-color="#141319"/>
    </linearGradient>
    <filter id="tile-shadow" x="-10%" y="-10%" width="120%" height="128%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#14102A" flood-opacity=".35"/>
    </filter>
  </defs>
  <use href="#tile" fill="url(#graphite)" filter="url(#tile-shadow)"/>
  <!-- The box outline and T mark are straight-line polygons; the menu bar template reuses them. -->
  <path id="box" d="M512 232L752 372L752 652L512 792L272 652L272 372Z" fill="#5B2DC4"/>
  <g stroke-linejoin="round" stroke-width="6">
    <path d="M512 232L752 372L512 512L272 372Z" fill="#C4B0FF" stroke="#D9CCFF"/>
    <path d="M272 372L512 512V792L272 652Z" fill="#8B5CF6" stroke="#9D74F8"/>
    <path d="M512 512L752 372V652L512 792Z" fill="#5B2DC4" stroke="#6838D0"/>
  </g>
  <path id="mark" d="M310 450L474 546L474 596L414 561L414 684L370 659L370 536L310 501Z" fill="#F3EEFF" stroke="#F3EEFF" stroke-width="4" stroke-linejoin="round"/>
</svg>
